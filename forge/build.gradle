// Implementation Forge 1.20.1 (47.4.20).
//
// Architectury Loom 1.4 compile ce module, mais son lancement en developpement casse sous Forge
// 47.4 : le jar de Minecraft fabrique par Loom n'a pas de dossier META-INF/versions, et Forge
// meurt au scan des mods sur UnionFileSystem$NoSuchFileException. ForgeGradle est donc conserve
// ici, comme avant la restructuration. Fabric utilise Architectury Loom ; NeoForge utilise le
// meme ForgeGradle avec son artefact userdev.
//
// Le code commun est inclus par sourceSet (common/src/main/java) en attendant le portage des
// classes neutres.

plugins {
    id 'net.minecraftforge.gradle' version '6.0.24'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

base {
    archivesName = "${rootProject.mod_id}-forge"
}

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
// Les ressources generees (DataGen) restent propres a ce chargeur.
sourceSets.main.resources.srcDir 'src/generated/resources'

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.rootProject.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                academy {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', rootProject.mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', rootProject.mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', rootProject.mod_id
        }

        data {
            workingDirectory project.rootProject.file('run-data')
            args '--mod', rootProject.mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    flatDir {
        dir 'libs'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// DebugBridge : outil de test client uniquement, jamais livre avec le mod.
def debugBridgeEnClient = gradle.startParameter.taskNames.any { it.toLowerCase().contains('runclient') }

dependencies {
    minecraft "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    compileOnly fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-forge-api:${rootProject.jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-forge:${rootProject.jei_version}")

    compileOnly fg.deobf("com.blamejared.crafttweaker:CraftTweaker-forge-${rootProject.minecraft_version}:${rootProject.crafttweaker_version}")

    if (debugBridgeEnClient) {
        runtimeOnly fg.deobf("com.blamejared.crafttweaker:CraftTweaker-forge-${rootProject.minecraft_version}:${rootProject.crafttweaker_version}")
        runtimeOnly fg.deobf("debugbridge:debugbridge:2.0.0")
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand(
                mod_id: rootProject.mod_id,
                mod_version: project.version,
                loader_version_range: rootProject.loader_version_range,
                forge_version_range: rootProject.forge_version_range,
                minecraft_version_range: rootProject.minecraft_version_range
        )
    }
}
