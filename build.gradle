// Racine du projet multiloader AcademyCraft.
//
// common/ et fabric/ utilisent Architectury Loom (gradle/minecraft-module.gradle pose les
// mappings officiels communs). forge/ et neoforge/ utilisent ForgeGradle, voir MULTILOADER.md
// pour la raison de ce choix. Le code commun est inclus par sourceSet (forge, neoforge) ou
// fusionne dans le jar (fabric).

plugins {
    id 'dev.architectury.loom' version "${loom_version}" apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

subprojects {
    apply plugin: 'java'

    group = rootProject.mod_group_id
    version = rootProject.mod_version

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
    }

    repositories {
        mavenCentral()
        maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases/' }
        maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
        flatDir { dirs rootProject.file('libs') }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
