// Implementation Fabric. Ce jar sert aussi pour Quilt : Quilt Loader lit fabric.mod.json et charge
// les mods Fabric sans adaptation.

plugins {
    id 'dev.architectury.loom'
    id 'com.github.johnrengelman.shadow'
}

apply from: rootProject.file('gradle/minecraft-module.gradle')

loom {
    accessWidenerPath = file('../common/src/main/resources/academy.accesswidener')
}

base {
    archivesName = "${rootProject.mod_id}-fabric"
}

configurations {
    // Classes communes visibles a la compilation et au runtime de developpement.
    common
    // Le meme jar commun, destine uniquement a etre fusionne dans le jar final.
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    common project(path: ':common', configuration: 'shared')
    shadowCommon(project(path: ':common', configuration: 'shared')) {
        transitive = false
    }
}

processResources {
    // Les assets et data du mod sont communs aux chargeurs. Les metadonnees de chargeur, elles,
    // restent propres au module (fabric.mod.json ici).
    from(rootProject.file('forge/src/main/resources')) {
        exclude 'META-INF/**'
        // Les structures restent dehors : elles portent des tables de butin pour des blocs qui
        // n'existent pas encore ici. Les recettes et les succes, eux, sont servis tels quels ; les
        // quelques-uns qui nomment un objet absent sont exclus un par un, pour que le journal reste
        // lisible.
        exclude 'data/academy/structures/**'
        exclude 'data/academy/forge/**'
        // Les objets qui n'existent pas encore sous Fabric : le brouilleur, les deux machines
        // developeur et le developpeur portable.
        exclude 'data/academy/recipes/ability_interferer.json'
        exclude 'data/academy/recipes/dev_normal.json'
        exclude 'data/academy/recipes/dev_normal2.json'
        exclude 'data/academy/recipes/dev_advanced.json'
        exclude 'data/academy/recipes/developer_portable.json'
        exclude 'data/academy/advancements/ac_developer.json'
        // Les tables de butin des trois blocs qui attendent les aptitudes.
        exclude 'data/academy/loot_tables/blocks/ability_interferer.json'
        exclude 'data/academy/loot_tables/blocks/dev_normal.json'
        exclude 'data/academy/loot_tables/blocks/dev_advanced.json'
    }
    from(rootProject.file('forge/src/generated/resources')) {
        exclude 'data/**'
    }

    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

jar {
    archiveClassifier = 'dev'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}
